name: Build APK
on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm install
      - run: npm run build
      - run: npx cap add android
      - run: cp android-overrides/AndroidManifest.xml android/app/src/main/AndroidManifest.xml
      - name: App icon (only if public/icon.png exists)
        run: |
          if [ -f public/icon.png ]; then
            mkdir -p assets
            cp public/icon.png assets/icon-only.png
            npx capacitor-assets generate --android --iconBackgroundColor '#1b1b1b' --iconBackgroundColorDark '#1b1b1b'
          else
            echo "No public/icon.png found, using default icon"
          fi
      - run: npx cap sync android
      - run: chmod +x android/gradlew && cd android && ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: app-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
